name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/dashboard/**"
      - "apps/bot-dashboard/**"
      - "README.md"
      - "docs/**"
      - ".gitignore"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Dependencies
        run: pnpm install

      - name: Build Applications (Turborepo Backend Only)
        run: pnpm turbo build --filter="@sentinel/bot..." --filter="@sentinel/worker..." --filter="@sentinel/api..."

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts || true

      - name: Run Prisma Database Migrations / Schema Push
        run: |
          ssh ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} "cd /opt/sentinel/apps/worker && DATABASE_URL='postgresql://deji@localhost/sentinel?host=/var/run/postgresql' npx prisma db push --accept-data-loss"

      - name: Deploy Dist Directories via Rsync
        run: |
          rsync -avz --delete apps/bot/dist/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/apps/bot/dist/
          rsync -avz --delete apps/worker/dist/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/apps/worker/dist/
          rsync -avz --delete apps/api/dist/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/apps/api/dist/

#      - name: Restart Systemd Services
#        run: |
#          ssh ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} "sudo systemctl restart sentinel-bot sentinel-worker sentinel-api"
