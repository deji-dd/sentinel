name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apps/dashboard/**"
      - "apps/bot-dashboard/**"
      - "README.md"
      - "docs/**"
      - ".gitignore"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Dependencies
        run: pnpm install

      - name: Build Applications (Turborepo Backend Only)
        run: pnpm turbo build --filter="@sentinel/bot..." --filter="@sentinel/worker..." --filter="@sentinel/api..."

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Dist & Database Schema via Rsync
        run: |
          rsync -avz --delete apps/bot/dist/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/apps/bot/dist/
          rsync -avz --delete apps/worker/dist/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/apps/worker/dist/
          rsync -avz --delete apps/api/dist/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/apps/api/dist/
          rsync -avz --delete --exclude=node_modules --exclude=.turbo packages/database/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/packages/database/
          rsync -avzL --delete node_modules/@prisma/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/node_modules/@prisma/
          rsync -avzL --delete node_modules/.prisma/ ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}:/opt/sentinel/node_modules/.prisma/

      - name: Run Prisma Database Migrations / Schema Push (via SSH Tunnel)
        run: |
          # Open SSH port forwarding: Runner localhost:5433 -> VPS /var/run/postgresql/.s.PGSQL.5432
          ssh -f -N -L 5433:/var/run/postgresql/.s.PGSQL.5432 ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }}
          sleep 2
          DATABASE_URL="postgresql://deji@localhost:5433/sentinel" pnpm --filter @sentinel/database db:push

#      - name: Restart Systemd Services
#        run: |
#          ssh ${{ secrets.GCP_USERNAME }}@${{ secrets.GCP_HOST }} "sudo systemctl restart sentinel-bot sentinel-worker sentinel-api"
