packages:
  - packages/*
  - apps/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msw: false
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

ignoredBuiltDependencies:
